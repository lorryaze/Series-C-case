services:
  backend:
    build: ./backend
    container_name: internal-tools-backend
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: sqlite:////data/internal_tools.db
      JWT_SECRET_KEY: demo-only-change-in-production
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - backend-data:/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_DOCS_URL: /docs
    container_name: internal-tools-frontend
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
